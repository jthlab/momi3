[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[project]
name = "momi3"
dynamic = ["version"]
description = "momi3 infers complex demographic history from the joint site frequency spectrum"
authors = [
    {name = "Enes Dilber", email = "enes@umich.edu"},
    {name = "Jonathan Terhorst", email = "jonth@umich.edu"},
]
dependencies = [
    "cvxpy>=1.4.2",
    "demes>=0.2.3",
    "demesdraw>=0.4.0",
    "diffrax>=0.6.0",
    "frozendict>=2.0.2",
    "gmpy2>=2.1.5",
    "jax>=0.5.0",
    "jaxopt>=0.8.3",
    "joblib>=1.4.0",
    "msprime>=1.2.0",
    "networkx>=3.0",
    "numpy>=1.23.0",
    "optax>=0.1.5",
    "pandas>=2.2.2",
    "scipy>=1.11.4",
    "sparse>=0.15.1",
    "sympy>=1.11.1",
    "tqdm>=4.66.2",
    "platformdirs>=4.2.0",
    "loguru>=0.7.2",
    "quadax>=0.2.1",
    "jax-dataclasses>=1.6.0",
    "lineax>=0.0.7",
    "equinox>=0.11.8",
    "optimistix>=0.0.9",
    "importlib-resources>=6.4.5",
]
requires-python = ">=3.11"
readme = "README.rst"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]

[project.urls]
Homepage = "https://github.com/jthlab/momi3/"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F722", "E501"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
known_first_party = "momi3"

[tool.pdm]
distribution = true
package-dir = "src"

[tool.pdm.version]
source = "scm"

[tool.pytest.ini_options]
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb"

[[tool.pdm.source]]
name = "nvidia"
url = "https://pypi.ngc.nvidia.com"
verify_ssl = true

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.5.0",
    "cuda-python<13,>=12.3",
    "nvidia-cuda-nvrtc-cu12>=12.3",
]

[dependency-groups]
dev = [
    "ipython>=8.23.0",
    "moments-popgen>=1.3.0",
    "stdpopsim>=0.2.0",
    "jsonpickle>=4.0.1",
    "pytest-runtime-xfail>=1.0.3",
]
testing = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "numpy>=1.26.4",
    "dadi>=2.3.3",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "momi @ git+https://github.com/popgenmethods/momi2@jth-fix-cython",
    "numpy>=1.26.4",
    "dadi>=2.3.3",
]
